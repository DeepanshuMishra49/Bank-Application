spring:
  application:
    name: Banking Management System

  # ─── DataSource ───────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/banking_db
    username: postgres
    password: postgresnew
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: BankingHikariPool

  # ─── JPA / Hibernate ──────────────────────────────────────────────────────────
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
        default_schema: public

  # ─── Flyway ───────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration
    schemas: public

  # ─── Security / Session ───────────────────────────────────────────────────────
  session:
    timeout: 30m

  mail:
    host: smtp.gmail.com
    port: 587
    username: deep270804@gmail.com
    password: abcd efgh ijkl mnop
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    enabled: true

  # ─── Web / Multipart ──────────────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

# ─── Server ───────────────────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: false   # Set to true in production (HTTPS only)
        same-site: strict
  error:
    whitelabel:
      enabled: false
    path: /error

# ─── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false   # SMTP creds are placeholders; exclude from health check
  metrics:
    tags:
      application: ${spring.application.name}

# ─── SpringDoc / Swagger ──────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    disable-swagger-default-url: true
  show-actuator: false

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  config: classpath:logback-spring.xml
  level:
    com.banking: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# ─── Application-specific ─────────────────────────────────────────────────────
banking:
  security:
    max-failed-attempts: 5
    lock-time-duration: 15   # minutes
  account:
    default-daily-limit: 100000   # INR 1,00,000
    minimum-balance: 500          # INR 500
  file:
    upload-dir: ./uploads/profiles
  pdf:
    output-dir: ./uploads/statements
