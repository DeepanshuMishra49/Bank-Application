<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<body>
<main layout:fragment="content">
    <div class="page-header">
        <h1>Employee Dashboard</h1>
        <p class="subtitle">Pending tasks and system overview</p>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
        <div class="stat-card warning">
            <div class="stat-icon"><i class="bi bi-hourglass-split"></i></div>
            <div class="stat-value" th:text="${dashboard?.pendingApprovals ?: 0}">0</div>
            <div class="stat-label">Pending Approvals</div>
        </div>
        <div class="stat-card success">
            <div class="stat-icon"><i class="bi bi-credit-card-2-front"></i></div>
            <div class="stat-value" th:text="${dashboard?.activeAccounts ?: 0}">0</div>
            <div class="stat-label">Active Accounts</div>
        </div>
        <div class="stat-card danger">
            <div class="stat-icon"><i class="bi bi-slash-circle"></i></div>
            <div class="stat-value" th:text="${dashboard?.frozenAccounts ?: 0}">0</div>
            <div class="stat-label">Frozen Accounts</div>
        </div>
        <div class="stat-card info">
            <div class="stat-icon"><i class="bi bi-shield-exclamation"></i></div>
            <div class="stat-value" th:text="${dashboard?.pendingKyc ?: 0}">0</div>
            <div class="stat-label">Pending KYC</div>
        </div>
        <div class="stat-card secondary">
            <div class="stat-icon"><i class="bi bi-arrow-left-right"></i></div>
            <div class="stat-value" th:text="${dashboard?.transactionsToday ?: 0}">0</div>
            <div class="stat-label">Transactions Today</div>
        </div>
        <div class="stat-card primary">
            <div class="stat-icon"><i class="bi bi-person-check"></i></div>
            <div class="stat-value" th:text="${dashboard?.totalAccounts ?: 0}">0</div>
            <div class="stat-label">Total Accounts</div>
        </div>
    </div>

    <div class="grid-2">
        <!-- Pending Customers -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">Pending Approvals</div>
                <a th:href="@{/employee/customers}" class="btn btn-secondary btn-sm">
                    <i class="bi bi-arrow-right"></i> All Customers
                </a>
            </div>

            <div th:if="${pendingCustomers == null or pendingCustomers.isEmpty()}" class="table-empty">
                <div class="empty-icon">✅</div>
                <p>No pending approvals! Great work.</p>
            </div>

            <div th:each="cust : ${pendingCustomers}" class="flex items-center justify-between"
                 style="padding: 12px 0; border-bottom: 1px solid var(--border);">
                <div class="flex items-center gap-3">
                    <div class="user-avatar" style="width:36px; height:36px; font-size:0.875rem;"
                         th:text="${cust.firstName?.substring(0,1)?.toUpperCase() ?: 'U'}">U</div>
                    <div>
                        <div class="font-semibold text-sm" th:text="${cust.fullName}">Name</div>
                        <div class="text-xs text-muted" th:text="${cust.customerId}">ID</div>
                    </div>
                </div>
                <form th:action="@{/employee/customers/{id}/approve(id=${cust.customerId})}"
                      method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-success btn-sm"
                            data-confirm="Approve this customer?">
                        <i class="bi bi-check2"></i> Approve
                    </button>
                </form>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">Quick Actions</div>
            </div>
            <div class="quick-actions">
                <a th:href="@{/employee/customers}" class="quick-action-btn">
                    <div class="quick-action-icon" style="background: rgba(79,110,247,0.15); color: #4F6EF7;">
                        <i class="bi bi-people"></i>
                    </div>
                    <span class="qa-label">Customers</span>
                </a>
                <a th:href="@{/employee/accounts}" class="quick-action-btn">
                    <div class="quick-action-icon" style="background: rgba(16,185,129,0.15); color: #10B981;">
                        <i class="bi bi-credit-card-2-front"></i>
                    </div>
                    <span class="qa-label">Accounts</span>
                </a>
                <a th:href="@{/employee/kyc}" class="quick-action-btn">
                    <div class="quick-action-icon" style="background: rgba(245,158,11,0.15); color: #F59E0B;">
                        <i class="bi bi-shield-check"></i>
                    </div>
                    <span class="qa-label">KYC Queue</span>
                </a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
