<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<body>
<main layout:fragment="content">
    <div class="page-header">
        <h1>Customer Management</h1>
        <p class="subtitle">View and manage customer accounts</p>
    </div>

    <!-- Search -->
    <div class="card mb-5">
        <form th:action="@{/employee/customers}" method="get" class="flex gap-3 items-center">
            <div class="search-bar" style="flex:1; max-width:100%;">
                <span class="search-icon"><i class="bi bi-search"></i></span>
                <input type="text" name="search" th:value="${search}"
                       placeholder="Search by name, email, phone, customer ID..."/>
            </div>
            <button type="submit" class="btn btn-primary">Search</button>
            <a th:href="@{/employee/customers}" class="btn btn-secondary">Clear</a>
        </form>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="card-title">All Customers</div>
            <span class="badge badge-primary" th:text="${customers?.totalElements + ' total'}">0</span>
        </div>

        <div class="table-wrapper">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Customer</th>
                        <th>Customer ID</th>
                        <th>Phone</th>
                        <th>Accounts</th>
                        <th>KYC</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${customers == null or customers.isEmpty()}">
                        <td colspan="7" class="table-empty">
                            <div class="empty-icon">👥</div>
                            <p>No customers found.</p>
                        </td>
                    </tr>
                    <tr th:each="cust : ${customers}">
                        <td>
                            <div class="flex items-center gap-3">
                                <div class="user-avatar" style="width:36px; height:36px; font-size:0.875rem;"
                                     th:text="${cust.firstName?.substring(0,1)?.toUpperCase() ?: 'U'}">U</div>
                                <div>
                                    <div class="font-semibold" th:text="${cust.fullName}">Name</div>
                                    <div class="text-xs text-muted" th:text="${cust.email}">email</div>
                                </div>
                            </div>
                        </td>
                        <td class="account-number text-sm" th:text="${cust.customerId}">—</td>
                        <td class="text-secondary text-sm" th:text="${cust.phone ?: '—'}">—</td>
                        <td class="text-center">
                            <span class="badge badge-primary" th:text="${cust.totalAccounts}">0</span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${cust.kycVerified} ? 'badge-success' : 'badge-warning'"
                                  th:text="${cust.kycVerified ? '✓ Verified' : '⏳ Pending'}">KYC</span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${cust.approved} ? 'badge-success' : 'badge-warning'"
                                  th:text="${cust.approved ? 'Approved' : 'Pending'}">Status</span>
                        </td>
                        <td>
                            <th:block th:unless="${cust.approved}">
                                <form th:action="@{/employee/customers/{id}/approve(id=${cust.customerId})}"
                                      method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-success btn-sm"
                                            data-confirm="Approve this customer?">
                                        <i class="bi bi-check2"></i> Approve
                                    </button>
                                </form>
                            </th:block>
                            <span th:if="${cust.approved}" class="text-muted text-xs">
                                <i class="bi bi-check2-circle text-success"></i> Approved
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="pagination-wrapper" th:if="${customers != null and customers.totalPages > 1}">
            <div class="pagination-info"
                 th:text="'Page ' + (${customers.number + 1}) + ' of ' + ${customers.totalPages}">
            </div>
            <div class="pagination">
                <a class="page-btn" th:classappend="${customers.first} ? 'disabled'"
                   th:href="@{/employee/customers(page=${customers.number - 1}, search=${search})}">‹</a>
                <a class="page-btn" th:each="i : ${#numbers.sequence(0, customers.totalPages - 1)}"
                   th:if="${i >= customers.number - 2 and i <= customers.number + 2}"
                   th:classappend="${i == customers.number} ? 'active'"
                   th:href="@{/employee/customers(page=${i}, search=${search})}"
                   th:text="${i + 1}">1</a>
                <a class="page-btn" th:classappend="${customers.last} ? 'disabled'"
                   th:href="@{/employee/customers(page=${customers.number + 1}, search=${search})}">›</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
