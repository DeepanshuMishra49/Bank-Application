<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<body>
<main layout:fragment="content">
    <div class="page-header">
        <h1>KYC Verification Queue</h1>
        <p class="subtitle">Review and verify customer KYC documents</p>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="card-title">Pending KYC</div>
            <span class="badge badge-warning" th:text="${pendingCustomers?.totalElements + ' pending'}">0</span>
        </div>

        <div th:if="${pendingCustomers == null or pendingCustomers.isEmpty()}" class="table-empty">
            <div class="empty-icon">✅</div>
            <p class="font-semibold">All KYC verifications are up to date!</p>
            <p class="text-muted text-sm mt-2">No pending customers at the moment.</p>
        </div>

        <div class="table-wrapper" th:unless="${pendingCustomers == null or pendingCustomers.isEmpty()}">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Customer</th>
                        <th>Customer ID</th>
                        <th>Phone</th>
                        <th>Registered On</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cust : ${pendingCustomers}">
                        <td>
                            <div class="flex items-center gap-3">
                                <div class="user-avatar" style="width:36px; height:36px; font-size:0.875rem;"
                                     th:text="${cust.firstName?.substring(0,1)?.toUpperCase() ?: 'U'}">U</div>
                                <div>
                                    <div class="font-semibold" th:text="${cust.fullName}">Name</div>
                                    <div class="text-xs text-muted" th:text="${cust.email}">email</div>
                                </div>
                            </div>
                        </td>
                        <td class="account-number text-sm" th:text="${cust.customerId}">—</td>
                        <td class="text-secondary text-sm" th:text="${cust.phone ?: '—'}">—</td>
                        <td class="text-muted text-sm"
                            th:text="${cust.createdAt != null ? #temporals.format(cust.createdAt, 'dd MMM yyyy') : '—'}">—</td>
                        <td>
                            <div class="flex gap-2">
                                <form th:action="@{/employee/kyc/{id}/verify(id=${cust.customerId})}"
                                      method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-success btn-sm"
                                            data-confirm="Verify KYC for this customer?">
                                        <i class="bi bi-shield-check"></i> Verify
                                    </button>
                                </form>
                                <button class="btn btn-danger btn-sm"
                                        th:onclick="'openRejectModal(\'' + ${cust.customerId} + '\')'">
                                    <i class="bi bi-shield-x"></i> Reject
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="pagination-wrapper" th:if="${pendingCustomers != null and pendingCustomers.totalPages > 1}">
            <div class="pagination">
                <a class="page-btn" th:classappend="${pendingCustomers.first} ? 'disabled'"
                   th:href="@{/employee/kyc(page=${pendingCustomers.number - 1})}">‹</a>
                <a class="page-btn" th:each="i : ${#numbers.sequence(0, pendingCustomers.totalPages - 1)}"
                   th:classappend="${i == pendingCustomers.number} ? 'active'"
                   th:href="@{/employee/kyc(page=${i})}"
                   th:text="${i + 1}">1</a>
                <a class="page-btn" th:classappend="${pendingCustomers.last} ? 'disabled'"
                   th:href="@{/employee/kyc(page=${pendingCustomers.number + 1})}">›</a>
            </div>
        </div>
    </div>

    <!-- Reject Modal -->
    <div class="modal-overlay" id="rejectKycModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Reject KYC</div>
                <button class="modal-close" onclick="BankingApp.Modal.close('rejectKycModal')">✕</button>
            </div>
            <div class="modal-body">
                <form id="rejectKycForm" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="form-group">
                        <label class="form-label">Rejection Reason *</label>
                        <select name="reason" class="form-select" required>
                            <option value="Documents insufficient">Documents insufficient</option>
                            <option value="Invalid documents">Invalid or expired documents</option>
                            <option value="Photo mismatch">Photo mismatch</option>
                            <option value="Address proof invalid">Address proof invalid</option>
                            <option value="Incomplete application">Incomplete application</option>
                        </select>
                    </div>
                    <div class="flex gap-3 justify-end">
                        <button type="button" class="btn btn-secondary"
                                onclick="BankingApp.Modal.close('rejectKycModal')">Cancel</button>
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-shield-x"></i> Reject KYC
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
<th:block layout:fragment="scripts">
<script>
function openRejectModal(customerId) {
    document.getElementById('rejectKycForm').action = '/employee/kyc/' + customerId + '/reject';
    BankingApp.Modal.open('rejectKycModal');
}
</script>
</th:block>
</body>
</html>
