<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>500 — Server Error | BankPortal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:40px;">
    <div style="max-width:480px;">
        <div style="font-size:5rem; margin-bottom:16px;">⚠️</div>
        <h1 style="font-size:6rem; font-weight:800; background: linear-gradient(135deg,#6366F1,#818CF8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; line-height:1; margin-bottom:8px;">500</h1>
        <h2 style="font-size:1.5rem; font-weight:700; margin-bottom:12px;">Internal Server Error</h2>
        <p class="text-secondary mb-3">Something went wrong on our end. Our team has been notified. Please try again in a few moments.</p>
        <div th:if="${message}" class="alert alert-warning text-left mb-4">
            <span class="alert-icon"><i class="bi bi-exclamation-triangle-fill"></i></span>
            <span th:text="${message}">Error details</span>
        </div>
        <div class="flex gap-3 justify-center">
            <a href="javascript:location.reload()" class="btn btn-secondary">
                <i class="bi bi-arrow-clockwise"></i> Retry
            </a>
            <a th:href="@{/}" class="btn btn-primary">
                <i class="bi bi-house"></i> Home
            </a>
        </div>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
<script>document.addEventListener('DOMContentLoaded', () => ThemeManager.init());</script>
</body>
</html>
