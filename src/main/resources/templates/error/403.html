<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>403 — Access Denied | BankPortal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:40px;">
    <div style="max-width:420px;">
        <div style="font-size:5rem; margin-bottom:16px;">🔒</div>
        <h1 style="font-size:6rem; font-weight:800; background: linear-gradient(135deg,#EF4444,#F87171); -webkit-background-clip:text; -webkit-text-fill-color:transparent; line-height:1; margin-bottom:8px;">403</h1>
        <h2 style="font-size:1.5rem; font-weight:700; margin-bottom:12px;">Access Denied</h2>
        <p class="text-secondary mb-5">You don't have permission to view this page. Please contact your administrator if you believe this is an error.</p>
        <div class="flex gap-3 justify-center">
            <a href="javascript:history.back()" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Go Back
            </a>
            <a th:href="@{/}" class="btn btn-primary">
                <i class="bi bi-house"></i> Home
            </a>
        </div>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
<script>document.addEventListener('DOMContentLoaded', () => ThemeManager.init());</script>
</body>
</html>
