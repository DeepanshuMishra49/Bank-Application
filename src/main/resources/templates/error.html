<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Error — SecureBank</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body class="bg-dark flex items-center justify-center min-h-screen">
    <div class="card text-center" style="max-width: 500px; padding: 2.5rem;">
        <div style="font-size: 3.5rem; color: #EF4444; margin-bottom: 1rem;">
            <i class="bi bi-exclamation-triangle-fill"></i>
        </div>
        <h2 class="text-2xl font-bold mb-2">Something Went Wrong</h2>
        <p class="text-secondary text-sm mb-4" th:text="${message ?: 'An unexpected error occurred. Please try again later.'}">
            An unexpected error occurred.
        </p>
        <div class="flex justify-center gap-3">
            <a href="javascript:history.back()" class="btn btn-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Go Back
            </a>
            <a th:href="@{/}" class="btn btn-primary btn-sm">
                <i class="bi bi-house"></i> Home
            </a>
        </div>
    </div>
</body>
</html>
