<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<body>
<main layout:fragment="content">
    <div class="page-header">
        <div class="flex justify-between items-center">
            <div>
                <h1>Customer Management</h1>
                <p class="subtitle">Create, approve, and manage all customers</p>
            </div>
            <button class="btn btn-primary" onclick="BankingApp.Modal.open('createCustomerModal')">
                <i class="bi bi-person-plus"></i> New Customer
            </button>
        </div>
    </div>

    <!-- Search Bar -->
    <div class="card mb-5">
        <form th:action="@{/admin/customers}" method="get" class="flex gap-3 items-center">
            <div class="search-bar" style="max-width: 100%; flex: 1;">
                <span class="search-icon"><i class="bi bi-search"></i></span>
                <input type="text" name="search" th:value="${search}"
                       placeholder="Search by name, email, phone, customer ID..." />
            </div>
            <button type="submit" class="btn btn-primary">Search</button>
            <a th:href="@{/admin/customers}" class="btn btn-secondary">Clear</a>
        </form>
    </div>

    <!-- Customers Table -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">All Customers</div>
            <span class="badge badge-primary" th:text="${customers?.totalElements + ' total'}">0</span>
        </div>

        <div class="table-wrapper">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Customer</th>
                        <th>Customer ID</th>
                        <th>Phone</th>
                        <th>Accounts</th>
                        <th>KYC</th>
                        <th>Status</th>
                        <th>Joined</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${customers == null or customers.isEmpty()}">
                        <td colspan="8" class="table-empty">
                            <div class="empty-icon">👥</div>
                            <p>No customers found.</p>
                        </td>
                    </tr>
                    <tr th:each="cust : ${customers}">
                        <td>
                            <div class="flex items-center gap-3">
                                <div class="user-avatar" style="width:36px; height:36px; font-size:0.875rem;"
                                     th:text="${cust.firstName?.substring(0,1)?.toUpperCase() ?: 'U'}">U</div>
                                <div>
                                    <div class="font-semibold" th:text="${cust.fullName}">Name</div>
                                    <div class="text-xs text-muted" th:text="${cust.email}">email</div>
                                </div>
                            </div>
                        </td>
                        <td class="account-number text-sm" th:text="${cust.customerId}">—</td>
                        <td class="text-secondary text-sm" th:text="${cust.phone ?: '—'}">—</td>
                        <td class="text-center">
                            <span class="badge badge-primary" th:text="${cust.totalAccounts}">0</span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${cust.kycVerified} ? 'badge-success' : 'badge-warning'"
                                  th:text="${cust.kycVerified ? '✓ Verified' : '⏳ Pending'}">KYC</span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${cust.approved} ? 'badge-success' : 'badge-warning'"
                                  th:text="${cust.approved ? 'Approved' : 'Pending'}">Status</span>
                        </td>
                        <td class="text-muted text-sm"
                            th:text="${cust.createdAt != null ? #temporals.format(cust.createdAt, 'dd MMM yyyy') : '—'}">—</td>
                        <td>
                            <div class="flex gap-1">
                                <th:block th:unless="${cust.approved}">
                                    <form th:action="@{/admin/customers/{id}/approve(id=${cust.customerId})}"
                                          method="post" style="display:inline;">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-success btn-sm btn-icon"
                                                title="Approve Customer"
                                                data-confirm="Approve this customer?">
                                            <i class="bi bi-check2"></i>
                                        </button>
                                    </form>
                                </th:block>
                                <form th:action="@{/admin/customers/{id}/deactivate(id=${cust.customerId})}"
                                      method="post" style="display:inline;">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-danger btn-sm btn-icon"
                                            title="Deactivate Customer"
                                            data-confirm="Deactivate this customer? They will lose access.">
                                        <i class="bi bi-person-x"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="pagination-wrapper" th:if="${customers != null and customers.totalPages > 1}">
            <div class="pagination-info"
                 th:text="'Page ' + (${customers.number + 1}) + ' of ' + ${customers.totalPages}">
            </div>
            <div class="pagination">
                <a class="page-btn" th:classappend="${customers.first} ? 'disabled'"
                   th:href="@{/admin/customers(page=${customers.number - 1}, search=${search})}">‹</a>
                <a class="page-btn" th:each="i : ${#numbers.sequence(0, customers.totalPages - 1)}"
                   th:if="${i >= customers.number - 2 and i <= customers.number + 2}"
                   th:classappend="${i == customers.number} ? 'active'"
                   th:href="@{/admin/customers(page=${i}, search=${search})}"
                   th:text="${i + 1}">1</a>
                <a class="page-btn" th:classappend="${customers.last} ? 'disabled'"
                   th:href="@{/admin/customers(page=${customers.number + 1}, search=${search})}">›</a>
            </div>
        </div>
    </div>

    <!-- Create Customer Modal -->
    <div class="modal-overlay" id="createCustomerModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Create New Customer</div>
                <button class="modal-close" onclick="BankingApp.Modal.close('createCustomerModal')">✕</button>
            </div>
            <div class="modal-body">
                <form th:action="@{/admin/customers/create}" method="post"
                      th:object="${createRequest}" novalidate>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="grid-2">
                        <div class="form-group">
                            <label class="form-label">First Name *</label>
                            <input type="text" th:field="*{firstName}" class="form-control" required/>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Last Name *</label>
                            <input type="text" th:field="*{lastName}" class="form-control" required/>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email *</label>
                        <input type="email" th:field="*{email}" class="form-control" required/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone *</label>
                        <input type="tel" th:field="*{phone}" class="form-control" maxlength="10" required/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password *</label>
                        <input type="password" th:field="*{password}" class="form-control" required/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Gender</label>
                        <select th:field="*{gender}" class="form-select">
                            <option value="">Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Occupation</label>
                        <input type="text" th:field="*{occupation}" class="form-control"/>
                    </div>
                    <div class="flex gap-3 justify-end">
                        <button type="button" class="btn btn-secondary"
                                onclick="BankingApp.Modal.close('createCustomerModal')">Cancel</button>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-person-plus"></i> Create Customer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
