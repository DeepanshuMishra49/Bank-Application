<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<body>
<main layout:fragment="content">
    <div class="page-header">
        <div class="flex justify-between items-center">
            <div>
                <h1>Account Management</h1>
                <p class="subtitle">View, freeze and manage all bank accounts</p>
            </div>
        </div>
    </div>

    <!-- Search -->
    <div class="card mb-5">
        <form th:action="@{/admin/accounts}" method="get" class="flex gap-3 items-center">
            <div class="search-bar" style="flex: 1; max-width: 100%;">
                <span class="search-icon"><i class="bi bi-search"></i></span>
                <input type="text" name="search" th:value="${search}"
                       placeholder="Search by account number or customer name..."/>
            </div>
            <button type="submit" class="btn btn-primary">Search</button>
            <a th:href="@{/admin/accounts}" class="btn btn-secondary">Clear</a>
        </form>
    </div>

    <!-- Accounts Table -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">All Accounts</div>
            <span class="badge badge-primary" th:text="${accounts?.totalElements + ' total'}">0</span>
        </div>

        <div class="table-wrapper">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Account Number</th>
                        <th>Customer</th>
                        <th>Type</th>
                        <th>Balance</th>
                        <th>Status</th>
                        <th>Daily Limit</th>
                        <th>Opened</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${accounts == null or accounts.isEmpty()}">
                        <td colspan="8" class="table-empty">
                            <div class="empty-icon">🏦</div>
                            <p>No accounts found.</p>
                        </td>
                    </tr>
                    <tr th:each="acc : ${accounts}">
                        <td class="account-number text-sm" th:text="${acc.accountNumber}">—</td>
                        <td>
                            <div class="font-semibold text-sm" th:text="${acc.customerName}">Name</div>
                            <div class="text-xs text-muted account-number" th:text="${acc.customerId}">ID</div>
                        </td>
                        <td><span class="badge badge-secondary" th:text="${acc.accountType}">SAVINGS</span></td>
                        <td class="font-bold"
                            th:text="${acc?.balance != null ? '₹' + #numbers.formatDecimal(acc.balance, 1, 'COMMA', 2, 'POINT') : '₹0.00'}">₹0</td>
                        <td>
                            <span class="flex items-center gap-1">
                                <span class="status-dot"
                                      th:classappend="${acc.status?.name() == 'ACTIVE'} ? 'active' : (${acc.status?.name() == 'FROZEN'} ? 'frozen' : 'closed')"></span>
                                <span class="badge"
                                      th:classappend="${acc.status?.name() == 'ACTIVE'} ? 'badge-success' : (${acc.status?.name() == 'FROZEN'} ? 'badge-info' : 'badge-danger')"
                                      th:text="${acc.status}">ACTIVE</span>
                            </span>
                        </td>
                        <td class="text-secondary text-sm"
                            th:text="${acc?.dailyTransferLimit != null ? '₹' + #numbers.formatDecimal(acc.dailyTransferLimit, 1, 'COMMA', 0, 'POINT') : '₹0'}">₹1,00,000</td>
                        <td class="text-muted text-sm"
                            th:text="${acc.createdAt != null ? #temporals.format(acc.createdAt, 'dd MMM yyyy') : '—'}">—</td>
                        <td>
                            <div class="flex gap-1">
                                <th:block th:if="${acc.status?.name() != 'FROZEN' and acc.status?.name() != 'CLOSED'}">
                                    <form th:action="@{/admin/accounts/{no}/freeze(no=${acc.accountNumber})}"
                                          method="post" style="display:inline;">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-warning btn-sm btn-icon"
                                                title="Freeze Account"
                                                data-confirm="Freeze account? No transactions will be allowed.">
                                            <i class="bi bi-lock"></i>
                                        </button>
                                    </form>
                                </th:block>
                                <th:block th:if="${acc.status?.name() == 'FROZEN'}">
                                    <form th:action="@{/admin/accounts/{no}/activate(no=${acc.accountNumber})}"
                                          method="post" style="display:inline;">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-success btn-sm btn-icon"
                                                title="Activate Account"
                                                data-confirm="Activate this frozen account?">
                                            <i class="bi bi-unlock"></i>
                                        </button>
                                    </form>
                                </th:block>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="pagination-wrapper" th:if="${accounts != null and accounts.totalPages > 1}">
            <div class="pagination-info"
                 th:text="'Page ' + (${accounts.number + 1}) + ' of ' + ${accounts.totalPages}">
            </div>
            <div class="pagination">
                <a class="page-btn" th:classappend="${accounts.first} ? 'disabled'"
                   th:href="@{/admin/accounts(page=${accounts.number - 1})}">‹</a>
                <a class="page-btn" th:each="i : ${#numbers.sequence(0, accounts.totalPages - 1)}"
                   th:if="${i >= accounts.number - 2 and i <= accounts.number + 2}"
                   th:classappend="${i == accounts.number} ? 'active'"
                   th:href="@{/admin/accounts(page=${i})}"
                   th:text="${i + 1}">1</a>
                <a class="page-btn" th:classappend="${accounts.last} ? 'disabled'"
                   th:href="@{/admin/accounts(page=${accounts.number + 1})}">›</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
