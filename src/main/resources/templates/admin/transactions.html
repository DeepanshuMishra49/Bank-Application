<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<body>
<main layout:fragment="content">
    <div class="page-header">
        <h1>All Transactions</h1>
        <p class="subtitle">System-wide transaction log</p>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="card-title">Transaction Ledger</div>
            <span class="badge badge-primary" th:text="${transactions?.totalElements + ' records'}">0</span>
        </div>

        <div class="table-wrapper">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Reference</th>
                        <th>Account</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Balance After</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${transactions == null or transactions.isEmpty()}">
                        <td colspan="8" class="table-empty">
                            <div class="empty-icon">💳</div>
                            <p>No transactions found.</p>
                        </td>
                    </tr>
                    <tr th:each="txn : ${transactions}">
                        <td class="monospace text-xs" th:text="${txn.referenceNumber}">—</td>
                        <td class="account-number text-sm" th:text="${txn.accountNumber}">—</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${txn.transactionType?.name()?.contains('DEPOSIT') or txn.transactionType?.name()?.contains('IN')} ? 'badge-success' : (${txn.transactionType?.name()?.contains('TRANSFER')} ? 'badge-info' : 'badge-danger')"
                                  th:text="${txn.transactionType}">TYPE</span>
                        </td>
                        <td>
                            <span class="txn-amount"
                                  th:classappend="${txn.transactionType?.name()?.contains('DEPOSIT') or txn.transactionType?.name()?.contains('IN')} ? 'credit' : 'debit'"
                                  th:text="'₹' + #numbers.formatDecimal(txn.amount, 1, 'COMMA', 2, 'POINT')">₹0</span>
                        </td>
                        <td th:text="'₹' + #numbers.formatDecimal(txn.balanceAfter, 1, 'COMMA', 2, 'POINT')">₹0</td>
                        <td class="text-secondary text-sm" th:text="${txn.description ?: '—'}">—</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${txn.status?.name() == 'SUCCESS'} ? 'badge-success' : 'badge-danger'"
                                  th:text="${txn.status}">SUCCESS</span>
                        </td>
                        <td class="text-muted text-sm"
                            th:text="${txn.createdAt != null ? #temporals.format(txn.createdAt, 'dd MMM yyyy HH:mm') : '—'}">—</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="pagination-wrapper" th:if="${transactions != null and transactions.totalPages > 1}">
            <div class="pagination-info"
                 th:text="'Page ' + (${transactions.number + 1}) + ' of ' + ${transactions.totalPages}">
            </div>
            <div class="pagination">
                <a class="page-btn" th:classappend="${transactions.first} ? 'disabled'"
                   th:href="@{/admin/transactions(page=${transactions.number - 1})}">‹</a>
                <a class="page-btn" th:each="i : ${#numbers.sequence(0, T(java.lang.Math).min(transactions.totalPages - 1, 9))}"
                   th:classappend="${i == transactions.number} ? 'active'"
                   th:href="@{/admin/transactions(page=${i})}"
                   th:text="${i + 1}">1</a>
                <a class="page-btn" th:classappend="${transactions.last} ? 'disabled'"
                   th:href="@{/admin/transactions(page=${transactions.number + 1})}">›</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
