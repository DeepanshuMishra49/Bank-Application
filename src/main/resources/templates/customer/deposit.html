<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<body>
<main layout:fragment="content">
    <div class="page-header">
        <h1>Deposit Money</h1>
        <p class="subtitle">Add funds to your bank account</p>
    </div>

    <div class="grid-2">
        <div class="card">
            <div class="card-header">
                <div class="card-title">Deposit Details</div>
            </div>

            <form th:action="@{/customer/deposit}" method="post"
                  th:object="${depositRequest}" data-validate="true" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label class="form-label" for="depositAccount">Account Number *</label>
                    <div class="input-group">
                        <span class="input-icon"><i class="bi bi-credit-card-2-front"></i></span>
                        <input id="depositAccount" type="text" th:field="*{accountNumber}"
                               class="form-control" th:classappend="${#fields.hasErrors('accountNumber')} ? 'is-invalid'"
                               placeholder="Enter your account number" maxlength="20" required/>
                    </div>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('accountNumber')}">
                        <span th:errors="*{accountNumber}"></span>
                    </div>
                    <div class="text-xs text-muted mt-1" th:if="${accounts != null and !accounts.isEmpty()}">
                        Your Accounts:
                        <span th:each="acc, iterStat : ${accounts}">
                            <code class="text-primary font-semibold" style="cursor:pointer;"
                                  th:data-account="${acc.accountNumber}"
                                  onclick="document.getElementById('depositAccount').value=this.getAttribute('data-account')"
                                  th:text="${acc.accountNumber + ' (' + acc.accountType + ')'}">0000</code><span th:unless="${iterStat.last}">, </span>
                        </span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="depositAmount">Amount (₹) *</label>
                    <div class="input-group">
                        <span class="input-icon">₹</span>
                        <input id="depositAmount" type="number" th:field="*{amount}"
                               class="form-control" th:classappend="${#fields.hasErrors('amount')} ? 'is-invalid'"
                               placeholder="Enter deposit amount" min="1" step="0.01" required/>
                        <span class="input-suffix">INR</span>
                    </div>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('amount')}">
                        <span th:errors="*{amount}"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="depositDesc">Description (Optional)</label>
                    <input id="depositDesc" type="text" th:field="*{description}"
                           class="form-control" placeholder="e.g. Cash deposit, Salary"/>
                </div>

                <!-- Quick Amount Buttons -->
                <div class="mb-4">
                    <div class="form-label">Quick Amounts</div>
                    <div class="flex gap-2 flex-wrap">
                        <button type="button" class="btn btn-secondary btn-sm"
                                onclick="document.getElementById('depositAmount').value=1000">₹1,000</button>
                        <button type="button" class="btn btn-secondary btn-sm"
                                onclick="document.getElementById('depositAmount').value=5000">₹5,000</button>
                        <button type="button" class="btn btn-secondary btn-sm"
                                onclick="document.getElementById('depositAmount').value=10000">₹10,000</button>
                        <button type="button" class="btn btn-secondary btn-sm"
                                onclick="document.getElementById('depositAmount').value=25000">₹25,000</button>
                        <button type="button" class="btn btn-secondary btn-sm"
                                onclick="document.getElementById('depositAmount').value=50000">₹50,000</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-success btn-full btn-lg">
                    <i class="bi bi-arrow-down-circle"></i>
                    Deposit Now
                </button>
            </form>
        </div>

        <div class="card">
            <div class="card-title mb-4">Account Balances</div>
            <div th:each="acc : ${accounts}"
                 style="padding: 16px; background: var(--bg-input); border-radius: var(--radius-md); margin-bottom: 12px;">
                <div class="flex justify-between items-center">
                    <div>
                        <div class="badge badge-secondary mb-1" th:text="${acc.accountType}">SAVINGS</div>
                        <div class="account-number" th:text="${acc.accountNumber}">0000</div>
                    </div>
                    <div class="text-right">
                        <div class="font-bold text-xl"
                             th:text="${acc?.balance != null ? '₹' + #numbers.formatDecimal(acc.balance, 1, 'COMMA', 2, 'POINT') : '₹0.00'}">₹0</div>
                        <div class="text-xs text-muted">Current Balance</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
