<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<body>
<main layout:fragment="content">
    <div class="page-header">
        <h1>Withdraw Money</h1>
        <p class="subtitle">Withdraw funds from your bank account</p>
    </div>

    <div class="grid-2">
        <div class="card">
            <div class="card-header">
                <div class="card-title">Withdrawal Details</div>
            </div>

            <form th:action="@{/customer/withdraw}" method="post"
                  th:object="${withdrawRequest}" data-validate="true" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label class="form-label" for="withdrawAccount">Select Account *</label>
                    <select id="withdrawAccount" th:field="*{accountNumber}" class="form-select" required>
                        <option value="">Choose account</option>
                        <option th:each="acc : ${accounts}"
                                th:value="${acc.accountNumber}"
                                th:text="${acc.accountNumber + ' — ' + acc.accountType + ' (₹' + #numbers.formatDecimal(acc.balance, 1, 'COMMA', 2, 'POINT') + ')'}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="withdrawAmount">Amount (₹) *</label>
                    <div class="input-group">
                        <span class="input-icon">₹</span>
                        <input id="withdrawAmount" type="number" th:field="*{amount}"
                               class="form-control" th:classappend="${#fields.hasErrors('amount')} ? 'is-invalid'"
                               placeholder="Enter withdrawal amount" min="1" step="0.01" required/>
                        <span class="input-suffix">INR</span>
                    </div>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('amount')}">
                        <span th:errors="*{amount}"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="withdrawDesc">Description (Optional)</label>
                    <input id="withdrawDesc" type="text" th:field="*{description}"
                           class="form-control" placeholder="e.g. ATM withdrawal, Personal expense"/>
                </div>

                <!-- Quick Amount Buttons -->
                <div class="mb-4">
                    <div class="form-label">Quick Amounts</div>
                    <div class="flex gap-2 flex-wrap">
                        <button type="button" class="btn btn-secondary btn-sm"
                                onclick="document.getElementById('withdrawAmount').value=500">₹500</button>
                        <button type="button" class="btn btn-secondary btn-sm"
                                onclick="document.getElementById('withdrawAmount').value=1000">₹1,000</button>
                        <button type="button" class="btn btn-secondary btn-sm"
                                onclick="document.getElementById('withdrawAmount').value=2000">₹2,000</button>
                        <button type="button" class="btn btn-secondary btn-sm"
                                onclick="document.getElementById('withdrawAmount').value=5000">₹5,000</button>
                        <button type="button" class="btn btn-secondary btn-sm"
                                onclick="document.getElementById('withdrawAmount').value=10000">₹10,000</button>
                    </div>
                </div>

                <div class="alert alert-info">
                    <span class="alert-icon"><i class="bi bi-info-circle"></i></span>
                    <span>A minimum balance of ₹500 must be maintained in your account at all times.</span>
                </div>

                <button type="submit" class="btn btn-danger btn-full btn-lg mt-3"
                        onclick="return confirm('Confirm cash withdrawal?')">
                    <i class="bi bi-arrow-up-circle"></i>
                    Withdraw Now
                </button>
            </form>
        </div>

        <div class="card">
            <div class="card-title mb-4">Account Balances</div>
            <div th:each="acc : ${accounts}"
                 style="padding: 16px; background: var(--bg-input); border-radius: var(--radius-md); margin-bottom: 12px;">
                <div class="flex justify-between items-center">
                    <div>
                        <div class="badge badge-secondary mb-1" th:text="${acc.accountType}">SAVINGS</div>
                        <div class="account-number" th:text="${acc.accountNumber}">0000</div>
                    </div>
                    <div class="text-right">
                        <div class="font-bold text-xl"
                             th:text="'₹' + #numbers.formatDecimal(acc.balance, 1, 'COMMA', 2, 'POINT')">₹0</div>
                        <div class="text-xs text-muted">Available</div>
                    </div>
                </div>
                <div class="mt-2 text-xs text-muted">
                    Max withdraw: <span class="text-warning font-semibold"
                                        th:text="'₹' + #numbers.formatDecimal(acc.balance.subtract(acc.minimumBalance).max(T(java.math.BigDecimal).ZERO), 1, 'COMMA', 2, 'POINT')">₹0</span>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
